connection_rules:
  - server client.*
  - client.* server

relationship_rules:
  server:
    trainer: client.*/trainer
    # the following 4 lines may be omitted when not using containerization
    client-selector: server
    aggregator: server
    configurator: server
    coordinator: server
  conductor:
    coordinator: server   # equivalent to server/coordinator

relationship_links:
  server:
    client: trainer
