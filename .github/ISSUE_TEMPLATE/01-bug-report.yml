name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please try to give clear steps for reproduction if you can.

  - type: checkboxes
    id: precheck
    attributes:
      label: Checklist
      description: Please check the following before submitting the issue
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I removed sensitive information from the information provided below
          required: true
        - label: I tested this on the latest release of RoleML
        - label: I can reproduce the problem consistently

  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Please summarize the problem you encountered
      placeholder: e.g., The log messages displayed on the console are garbled text.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What led to the problem? Please provide clear, minimal, repeatable steps if possible; providing the log messages and/or console output may also be helpful
      placeholder: |
        1. Go to ...
        2. Run ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: e.g., Logs should be displayed normally, similar to ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: RoleML version
      placeholder: e.g., v0.3.1
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The environment on which you run RoleML. If this is a network-related issue, providing the network and/or cluster configuration may be helpful
      placeholder: |
        e.g., Ubuntu 26.04, Python 3.11, Docker 28.4.0 (if you are using containerization)
        you may include anything unusual or important about the environment, such as corporate device, restricted network, or custom config
    validations:
      required: true

  - type: dropdown
    id: clean_env
    attributes:
      label: Is the environment clean?
      description: We recommend you to try reproducing the bug with a clean install of OS and/or virtual environment before submitting the issue
      options:
        - Yes, I only ran RoleML after setting up the environment
        - No, the same environment is being used for other purposes
        - No, but the problem still exists when using a clean environment
        - Not sure
    validations:
      required: true

  - type: textarea
    id: workload
    attributes:
      label: Workload
      description: What model and dataset are you working with? What DML architecture are you using?
      placeholder: |
        e.g.,
        - Model: VGG-16 (implemented in PyTorch)
        - Dataset: CIFAR-10 (from torchvision)
        - Architecture: Federated Learning
    validations:
      required: false

  - type: textarea
    id: possible_cause
    attributes:
      label: Possible cause / Workaround / Suggested fix (optional)
      description: If you have any ideas
      placeholder: It may be caused by ... / A temporary workaround is ... / A possible fix is ...
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks usage
        - Major issue
        - Minor issue
        - Cosmetic only
    validations:
      required: true

  - type: textarea
    id: remark
    attributes:
      label: Remark
    validations:
      required: false
